[project]
name = "edgelog"
version = "0.1.0"
description = "A trade journal that tells you if you actually have an edge."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "robin-stocks>=3.4.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "vectorbt>=0.28.2",
    "yfinance>=1.4.1",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
